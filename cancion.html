<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuestra Canción ❤️</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at top left,
                    #34205f 0%,
                    #17152f 40%,
                    #080b1c 85%
                );

            color: white;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =========================
           LUCES DEL FONDO
           ========================= */

        body::before {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            top: -180px;
            left: -180px;

            background:
                rgba(182,92,255,0.18);

            border-radius: 50%;

            filter: blur(100px);

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            bottom: -200px;
            right: -180px;

            background:
                rgba(255,117,195,0.14);

            border-radius: 50%;

            filter: blur(100px);

            pointer-events: none;
        }


        /* =========================
           CORAZONES
           ========================= */

        .corazones {
            position: fixed;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 1;
        }


        .corazones span {
            position: absolute;

            bottom: -50px;

            font-size: 25px;

            opacity: 0.3;

            color: #f49bff;

            animation:
                flotar 10s linear infinite;

            text-shadow:
                0 0 10px rgba(244,155,255,0.8);
        }


        .corazones span:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }


        .corazones span:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
        }


        .corazones span:nth-child(3) {
            left: 40%;
            animation-delay: 4s;
        }


        .corazones span:nth-child(4) {
            left: 55%;
            animation-delay: 1s;
        }


        .corazones span:nth-child(5) {
            left: 70%;
            animation-delay: 5s;
        }


        .corazones span:nth-child(6) {
            left: 85%;
            animation-delay: 3s;
        }


        /* =========================
           CONTENIDO
           ========================= */

        .contenedor {
            position: relative;

            z-index: 2;

            width: 90%;

            max-width: 800px;

            text-align: center;

            padding: 50px 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(52,32,95,0.92),
                    rgba(23,21,47,0.96)
                );

            border:
                1px solid rgba(244,155,255,0.25);

            border-radius: 30px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.55),
                0 0 40px rgba(182,92,255,0.15);
        }


        .pequeno {
            font-size: 13px;

            letter-spacing: 4px;

            color: #f4eaff;

            margin-bottom: 15px;
        }


        h1 {
            font-family: Georgia, serif;

            font-size: 50px;

            margin-bottom: 15px;

            color: white;

            text-shadow:
                0 0 10px rgba(255,255,255,0.35),
                0 0 25px rgba(244,155,255,0.55);
        }


        .linea {
            width: 100px;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #ff75c3,
                    white,
                    #b65cff
                );

            margin: 0 auto 25px;

            border-radius: 10px;

            box-shadow:
                0 0 15px rgba(255,117,195,0.7);
        }


        .mensaje {
            font-family: Georgia, serif;

            font-size: 21px;

            line-height: 1.7;

            color: #f4eaff;

            margin-bottom: 30px;
        }


        /* =========================
           REPRODUCTOR
           ========================= */

        .reproductor {
            position: relative;

            width: 100%;

            max-width: 560px;

            margin: 0 auto 30px;

            aspect-ratio: 16 / 9;

            border-radius: 20px;

            overflow: hidden;

            border:
                1px solid rgba(244,155,255,0.25);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.5),
                0 0 25px rgba(182,92,255,0.15);
        }


        .reproductor iframe {
            width: 100%;
            height: 100%;

            border: none;
        }


        /* =========================
           BOTONES
           ========================= */

        .botones {
            margin-top: 25px;
        }


        .boton {
            display: inline-block;

            padding: 14px 28px;

            margin: 7px;

            background:
                linear-gradient(
                    135deg,
                    #ff75c3,
                    #b65cff
                );

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-weight: bold;

            border:
                1px solid rgba(255,255,255,0.30);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.30),
                0 0 15px rgba(255,117,195,0.25);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .boton:hover {
            transform:
                translateY(-4px);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.40),
                0 0 25px rgba(255,117,195,0.50);
        }


        /* =========================
           ANIMACIÓN
           ========================= */

        @keyframes flotar {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);
            }
        }


        /* =========================
           CELULAR
           ========================= */

        @media (max-width: 600px) {

            .contenedor {
                width: 94%;

                padding: 35px 18px;
            }


            h1 {
                font-size: 36px;
            }


            .mensaje {
                font-size: 18px;
            }


            .pequeno {
                font-size: 11px;

                letter-spacing: 3px;
            }


            .reproductor {
                border-radius: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- CORAZONES -->

    <div class="corazones">

        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>

    </div>


    <!-- CONTENIDO -->

    <main class="contenedor">

        <div class="pequeno">
            UNA CANCION QUE NOS REPRESENTARA POR SIEMPRE
        </div>


        <h1>
            🎵 Nuestra Canción 🎵
        </h1>


        <div class="linea"></div>


        <p class="mensaje">
            Hay canciones que simplemente se escuchan...
            y hay canciones que guardan recuerdos. ❤️
        </p>


        <!-- YOUTUBE -->

        <div class="reproductor">

            <iframe
                src="https://www.youtube.com/embed/sD9_l3oDOag"
                title="Nuestra canción"
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen>
            </iframe>

        </div>


        <!-- BOTONES -->

        <div class="botones">

            <a
                href="galeria.html"
                class="boton">

                ← Volver a la galería

            </a>


            <a
                href="index.html"
                class="boton">

                🏠 Volver al inicio

            </a>


            <a
                href="oportunidad.html"
                class="boton">

                💜 Continuar

            </a>

        </div>

    </main>


</body>

</html>
